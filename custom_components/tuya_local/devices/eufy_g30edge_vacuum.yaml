name: Robot vacuum
products:
  - id: paapxs4vudcncsb9
    manufacturer: Eufy
    model: G30 Edge
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: power
        optional: true
      - id: 2
        type: boolean
        name: activate
        optional: true
      - id: 3
        type: string
        name: direction_control
        optional: true
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: back
            value: reverse
          - dps_val: left
            value: left
          - dps_val: right
            value: right
      - id: 5
        type: string
        name: command
        optional: true
        mapping:
          - dps_val: Spot
            value: clean_spot
          - dps_val: Auto
            value: auto
          - dps_val: Auto
            value: start
          - dps_val: Edge
            value: edge
          - dps_val: SmallRoom
            value: small_room
          - dps_val: null
            value: return_to_base
            value_redirect: return_home
      - id: 101
        type: boolean
        name: return_home
        optional: true
        mapping:
          - dps_val: true
            value: return_to_base
      - id: 15
        type: string
        name: status
        mapping:
          - dps_val: Charging
            value: charging
          - dps_val: completed
            value: docked
          - dps_val: Running
            value: cleaning
          - dps_val: standby
            value: standby
          - dps_val: Recharge
            value: returning
          - dps_val: Sleeping
            value: sleep
          - dps_val: recharge_needed
            value: returning
      - id: 102
        type: string
        name: fan_speed
        mapping:
          - dps_val: Standard
            value: Standard
          - dps_val: Turbo
            value: Turbo
          - dps_val: Max
            value: Max
          - dps_val: Boost_IQ
            value: Boost IQ
      - id: 103
        type: boolean
        name: locate
        optional: true
      - id: 104
        type: integer
        name: battery
        optional: true
      - id: 106
        type: integer
        name: error
        optional: true
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
        unit: "%"

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true

  - entity: sensor
    class: duration
    category: diagnostic
    dps:
      - id: 109
        type: integer
        name: sensor
        unit: min

  - entity: sensor
    name: Cleaning area
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        unit: m²

  - entity: switch
    name: Do not disturb
    category: config
    dps:
      - id: 107
        type: boolean
        name: switch

  - entity: switch
    name: Auto return
    category: config
    dps:
      - id: 135
        type: boolean
        name: switch
